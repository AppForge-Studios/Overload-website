<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0e06"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <g filter="url(#glow)" stroke="#FF9F4A" stroke-width="2.6" fill="none" stroke-linejoin="miter">
    <polygon points="21,12 32,18 32,30 21,36 10,30 10,18"/>
    <polygon points="54,34 54,46 43,52 32,46 32,34 43,28"/>
    <line x1="27" y1="27" x2="37" y2="37" stroke="#FF9F4A" stroke-width="6.5" stroke-linecap="square"/>
  </g>
</svg>
